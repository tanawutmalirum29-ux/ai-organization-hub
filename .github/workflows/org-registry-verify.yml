name: AI Team Registry Structural Check (Governance V2)
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'roles/**'
      - 'appointments/**'
      - 'README.md'
      - 'tools/*.mjs'
      - '.github/workflows/org-registry-verify.yml'
  push:
    branches:
      - 'proposal/governance-v2-hierarchical-signoff'
      - 'docs/v2-role-onboarding-skills-handoffs'
      - 'docs/v2-audit-activation-task-routing'
      - 'main'
      - 'org/registry'
    paths:
      - 'docs/**'
      - 'roles/**'
      - 'appointments/**'
      - 'README.md'
      - 'tools/*.mjs'
      - '.github/workflows/org-registry-verify.yml'
permissions:
  contents: read
jobs:
  verify-roster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify every role's skills, handoff, parent graph and ACK provenance
        run: node tools/check-ai-org.mjs
      - name: Verify all local Markdown file links
        run: node tools/check-governance-links.mjs
