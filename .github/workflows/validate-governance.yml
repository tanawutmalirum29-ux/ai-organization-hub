name: Validate Organization Governance
on:
  push:
    branches:
      - main
      - 'round/**'
  pull_request:
    branches:
      - main
jobs:
  protocol:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-governance.mjs
        env:
          BEFORE_SHA: ${{ github.event.before }}
