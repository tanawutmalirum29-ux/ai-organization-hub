name: Ant Kingdom — Simple Governance Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  commands-and-rulebook:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify simple rules and shorthand commands
        run: node --test tests/simple-workflow.test.mjs
