name: Bridge command wake-up
on:
  push:
    branches: [main]
    paths:
      - 'bridge/requests/**'
permissions:
  contents: read
concurrency:
  group: github-bridge-poll-main
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout command files for exact commit verification
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Notify Cloudflare to fetch GitHub Connector commands
        shell: bash
        run: |
          set -euo pipefail
          origin="https://ai-control-center.tanawutmalirum29.workers.dev"
          echo "Bridge delivery: GitHub request file committed; Worker fetches and validates it"
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 40 --retry 1 -X POST \
                -H "Origin: ${origin}" \
                -H "Content-Type: application/json" \
                --data '{}' \
                "${origin}/api/v1/bridge/sync" -o /tmp/bridge-sync.json; then
              python3 -c 'import json; x=json.load(open("/tmp/bridge-sync.json")); print("Bridge:", {k:x.get(k) for k in ("ok","processed","rejected","seen","errors")}); assert x.get("ok") is True'
              break
            fi
            if [[ "${attempt}" == "3" ]]; then
              echo "::error::Worker sync failed; the 5-minute Cron is a fallback"
              exit 1
            fi
            sleep 5
          done
          ids=$(git show --pretty=format: --name-only "$GITHUB_SHA" | grep -E '^bridge/requests/[0-9]{4}-[0-9]{2}-[0-9]{2}/[0-9a-f-]{36}\.json
          if [[ -z "${ids}" ]]; then
            echo "::warning::No JSON command file found in GitHub push event; sync itself succeeded"
            exit 0
          fi
          for command_id in ${ids}; do
            curl --fail --silent --show-error --max-time 15 "${origin}/api/v1/bridge/status?id=${command_id}" -o /tmp/bridge-receipt.json
            room_id=$(python3 -c 'import json; r=json.load(open("/tmp/bridge-receipt.json")).get("receipt"); assert r and r.get("status")=="DONE", r; assert r.get("room_id"), r; print(r["room_id"])')
            curl --fail --silent --show-error --max-time 15 "${origin}/api/v1/bridge/inbox?room_id=${room_id}" -o /tmp/bridge-inbox.json
            python3 -c 'import json; x=json.load(open("/tmp/bridge-inbox.json")); assert x.get("room") and x.get("members"); print("PASS D1 inbox:",x["room"]["id"],"members",len(x["members"]),"tasks",len(x.get("tasks",[])),"messages",len(x.get("messages",[])))'
            echo "PASS command ${command_id} delivery and D1 inbox"
          done
 | sed -E 's@.*/([0-9a-f-]{36})\.json$@\1@' | tr '\n' ' ')
          if [[ -z "${ids}" ]]; then
            echo "::warning::No JSON command file found in GitHub push event; sync itself succeeded"
            exit 0
          fi
          for command_id in ${ids}; do
            curl --fail --silent --show-error --max-time 15 "${origin}/api/v1/bridge/status?id=${command_id}" -o /tmp/bridge-receipt.json
            room_id=$(python3 -c 'import json; r=json.load(open("/tmp/bridge-receipt.json")).get("receipt"); assert r and r.get("status")=="DONE", r; assert r.get("room_id"), r; print(r["room_id"])')
            curl --fail --silent --show-error --max-time 15 "${origin}/api/v1/bridge/inbox?room_id=${room_id}" -o /tmp/bridge-inbox.json
            python3 -c 'import json; x=json.load(open("/tmp/bridge-inbox.json")); assert x.get("room") and x.get("members"); print("PASS D1 inbox:",x["room"]["id"],"members",len(x["members"]),"tasks",len(x.get("tasks",[])),"messages",len(x.get("messages",[])))'
            echo "PASS command ${command_id} delivery and D1 inbox"
          done
